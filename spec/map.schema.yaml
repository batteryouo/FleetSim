$schema: https://json-schema.org/draft/2020-12/schema
title: Cadence map spec v0
type: object
additionalProperties: false
required: [version, id, walls]
properties:
  version:
    type: integer
    const: 0
  id:
    $ref: '#/$defs/identifier'
  walls:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, center, size, yaw, z_min, z_max]
      properties:
        id:
          $ref: '#/$defs/identifier'
        center:
          $ref: '#/$defs/point'
        size:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            exclusiveMinimum: 0
        yaw:
          type: number
        z_min:
          type: number
        z_max:
          type: number
$defs:
  identifier:
    type: string
    pattern: '^[A-Za-z][A-Za-z0-9_]*$'
  point:
    type: array
    minItems: 2
    maxItems: 2
    items:
      type: number
