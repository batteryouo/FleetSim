$schema: https://json-schema.org/draft/2020-12/schema
title: Cadence robot spec v1
type: object
additionalProperties: false
required:
  - version
  - id
  - footprint
  - body
  - min_linear_velocity
  - max_linear_velocity
  - min_angular_velocity
  - max_angular_velocity
  - max_linear_acceleration
  - max_angular_acceleration
  - provisional
  - lidar
properties:
  version:
    type: integer
    const: 1
  id:
    type: string
    pattern: '^[A-Za-z][A-Za-z0-9_]*$'
  footprint:
    type: object
    additionalProperties: false
    required: [type, radius, center]
    properties:
      type:
        const: circle
      radius:
        type: number
        exclusiveMinimum: 0
      center:
        type: object
        additionalProperties: false
        required: [x, y]
        properties:
          x: {type: number}
          y: {type: number}
  body:
    type: object
    additionalProperties: false
    required: [z_min, z_max]
    properties:
      z_min:
        type: number
      z_max:
        type: number
  min_linear_velocity:
    type: number
  max_linear_velocity:
    type: number
  min_angular_velocity:
    type: number
  max_angular_velocity:
    type: number
  max_linear_acceleration:
    type: number
    exclusiveMinimum: 0
  max_angular_acceleration:
    type: number
    exclusiveMinimum: 0
  provisional:
    type: array
    uniqueItems: true
    items:
      type: string
  lidar:
    type: object
    additionalProperties: false
    required: [mount, beam_count, angle_min, angle_max, range_min, range_max, rate_hz]
    properties:
      mount:
        type: object
        additionalProperties: false
        required: [x, y, z, yaw]
        properties:
          x: {type: number}
          y: {type: number}
          z: {type: number}
          yaw: {type: number}
      beam_count: {type: integer, minimum: 2}
      angle_min: {type: number}
      angle_max: {type: number}
      range_min: {type: number, minimum: 0}
      range_max: {type: number, exclusiveMinimum: 0}
      rate_hz: {type: number, exclusiveMinimum: 0}
